{% set name = "eoreader" %}
{% set version = "0.24.4" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/eoreader-{{ version }}.tar.gz
  sha256: 2b9293d661b3103b0b52f5c7c86849843ea0f60481bea45c30d96ab9a009c69f

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - setuptools
    - python {{ python_min }}
  run:
    - python >={{ python_min }}
    - geopandas >=0.14.4
    - lxml
    - h5netcdf
    - rasterio >=1.3.10
    - xarray >=2024.06.0
    - rioxarray >=0.15.0
    - odc-geo >=0.5.0
    - rtree
    - cloudpathlib-s3 >=0.15.0
    - sertit >=1.50.2
    - validators
    - matplotlib-base
    - methodtools
    - spyndex >=0.7.1
    - pyresample
    - zarr
    - dict2xml
    - tifffile
    - ephem
    # stac    
    - pystac
    - xdem >=0.1.4

test:
  imports:
    - eoreader
    - eoreader.bands
    - eoreader.stac
    - eoreader.products
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: http://github.com/sertit/eoreader/
  summary: Remote-sensing opensource python library reading optical and SAR sensors, loading and stacking bands, clouds, DEM and index.
  license: Apache-2.0
  license_file: LICENSE
  description: Remote-sensing opensource python library reading optical and SAR sensors, loading and stacking bands, clouds, DEM and index.
  doc_url: https://eoreader.readthedocs.io/en/latest/
  dev_url: http://github.com/sertit/eoreader

extra:
  recipe-maintainers:
    - Alt-o
    - qpoterek
    - remi-braun
